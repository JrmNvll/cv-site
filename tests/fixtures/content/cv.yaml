# FIXTURE DE TEST — CONTENU ENTIÈREMENT FICTIF.
#
# Personne, entreprises, dates et diplômes sont inventés. Aucun élément du CV
# réel ne figure ici : le contenu réel vit dans CONTENT_DIR, hors de ce dépôt
# (AD-2). Ce fichier ne sert qu'à faire tourner les tests unitaires et e2e.
#
# Sa structure suit **le fichier de référence**, section par section : c'est le
# fichier réel qui définit le format (contrat de contenu), pas cette fixture.
#
# Les valeurs des champs **hors liste blanche** (AD-8) sont des sentinelles
# longues et uniques : `tests/unit/projection-leak.test.ts` vérifie qu'aucune
# d'elles n'apparaît dans une projection. Les banaliser affaiblirait ce test.

